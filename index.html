<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ma Boutique Officielle</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            color: #333;
        }
        header {
            background: #111;
            color: white;
            padding: 20px;
            text-align: center;
        }
        .container {
            padding: 20px;
            max-width: 900px;
            margin: auto;
        }
        .product {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .product img {
            width: 100%;
            max-width: 300px;
            display: block;
            margin: auto;
        }
        .btn {
            display: inline-block;
            background: #25D366;
            color: white;
            padding: 12px 20px;
            text-decoration: none;
            margin-top: 10px;
            border-radius: 5px;
            font-weight: bold;
        }
        footer {
            text-align: center;
            padding: 20px;
            background: #111;
            color: white;
            margin-top: 40px;
        }
    </style>
</head>
<body>

<header>
    <h1>Ma Boutique</h1>
    <p>Maillots de foot – Qualité premium</p>
</header>

<div class="container">

    <div class="product">
        <h2>Maillot Football 2024</h2>
        <img src="https://i.imgur.com/4ZQZ4ZB.jpg" alt="Maillot de foot">
        <p>Maillot haute qualité – confort, style et durabilité.</p>
        <p><strong>Prix : 35€</strong></p>
        <a class="btn" href="https://wa.me/TONNUMERO" target="_blank">Commander sur WhatsApp</a>
    </div>

</div>

<footer>
    © 2025 - Ma Boutique | Paiement sécurisé via WhatsApp
</footer>

</body>
</html>
